# Exemplo de configuração do Nginx como reverse proxy para o backend (porta 3333).
# Salve em /etc/nginx/sites-available/contratos e crie o symlink em sites-enabled.
# Troque "contratos.seudominio.com.br" pelo seu domínio.

server {
    listen 80;
    server_name contratos.seudominio.com.br;

    # Tamanho máximo de upload (PDFs pequenos, mas deixamos folga).
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3333;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# Depois de validar em HTTP, habilite HTTPS gratuitamente com:
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d contratos.seudominio.com.br
# O certbot ajusta este arquivo para porta 443 automaticamente.
